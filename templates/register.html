{% extends "base.html" %}
{% block content %}
<h2>會員註冊</h2>
<form method="POST">
    <div class="form-group">
        <label>使用者名稱：</label>
        <input type="text" name="username" required>
    </div>
    <div class="form-group">
        <label>設定密碼 (最少 8 碼)：</label>
        <input type="password" name="password" required>
    </div>
    <button type="submit">確認註冊</button>
</form>
<p>已有帳號？<a href="{{ url_for('login') }}">返回登入</a></p>
{% endblock %}
